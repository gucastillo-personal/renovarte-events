# CI de solo lectura: lint + tests del producer y del consumer, y validación
# de la infra Terraform. Nunca corre `terraform apply`/`destroy` — eso queda
# 100% manual, con aprobación humana explícita (ver CLAUDE.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  producer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: producer
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run pytest

  consumer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
