[project]
name = "renovarte-events-producer"
version = "0.1.0"
description = "Publica eventos de cambios de precio del catálogo RenovArte a AWS SNS."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
]

[project.scripts]
renovarte-events-producer = "producer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/producer"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true
